[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Match upstream hook-contracts foundry config so the same source compiles identically.

# Read-only access to test/fixtures/ so the SDK cross-validation test can
# load bytes generated by sdk/scripts/dump-fixture.ts.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 256

# Fork tests under test/fork/ are opt-in: they skip themselves unless
# BASE_SEPOLIA_RPC_URL is set. The endpoint below is registered so that
# `forge script --rpc-url base_sepolia` works without re-typing the URL.
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base         = "${BASE_RPC_URL}"
sepolia      = "${SEPOLIA_RPC_URL}"
